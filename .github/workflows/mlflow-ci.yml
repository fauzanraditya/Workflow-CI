name: MLflow CI Retraining and Docker Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2 joblib==1.4.2

      - name: Run MLflow Project retraining
        working-directory: MLProject
        run: |
          mlflow run . -P n_estimators=150 -P max_depth=10

      - name: Get latest MLflow run id
        id: get_run
        working-directory: MLProject
        run: |
          RUN_ID=$(find mlruns/0 -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1 | xargs basename)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Latest run id: $RUN_ID"

      - name: Upload MLflow runs as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifact
          path: MLProject/mlruns/

      - name: Build Docker image with MLflow
        working-directory: MLProject
        run: |
          mlflow models build-docker -m runs:/${{ steps.get_run.outputs.run_id }}/model -n smsml-fauzan-raditya

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker tag smsml-fauzan-raditya ${{ secrets.DOCKERHUB_USERNAME }}/smsml-fauzan-raditya:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smsml-fauzan-raditya:latest
